<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>球球布丁家属院 · 本地模板预览</title>
    <style>
      :root {
        --rpx: min(calc(100vw / 750), 0.72px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        max-width: 540px;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wx-text {
        white-space: pre-wrap;
      }
      .wx-block {
        display: contents;
      }
      .preview-head {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 12px 20px;
        background: #f7f2e9;
        border-bottom: 1px solid #d9ccbb;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .preview-head a {
        text-decoration: underline;
      }
      #toast {
        position: fixed;
        bottom: 24px;
        left: 10%;
        right: 10%;
        margin: auto;
        max-width: 400px;
        z-index: 20;
        background: #382f29;
        color: white;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      #toast:empty {
        display: none;
      }
      .preview-dialog {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #181614;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .preview-dialog img {
        width: 100%;
        max-width: 600px;
        height: 70vh;
        object-fit: contain;
      }
      .preview-dialog button {
        color: white;
        min-width: 72px;
      }
      .preview-dialog footer {
        display: flex;
        gap: 25px;
      }
    </style>
    <style id="app-css"></style>
    <style id="page-css"></style>
  </head>
  <body>
    <header class="preview-head">
      <a href="#home">球球布丁家属院</a><span>模板预览 · 非微信运行时</span>
    </header>
    <main id="app"></main>
    <div id="toast" role="status"></div>
    <script src="/runtime.js"></script>
  </body>
</html>
